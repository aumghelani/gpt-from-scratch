[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-scratch"
version = "0.1.0"
description = "A decoder-only Transformer language model trained from scratch: BPE, RoPE, KV-cache, SFT chat, streaming server"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
compare = ["tiktoken>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27", "hypothesis>=6.100"]

[project.scripts]
gpt-scratch = "gpt_scratch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.coverage.run]
source = ["gpt_scratch"]

[tool.ruff.lint]
ignore = ["C408"]
